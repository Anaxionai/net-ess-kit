#!/usr/sbin/nft -f
# labnet-fw's firewall. Check it:  docker exec labnet-fw nft -c -f /lab/nftables.conf
# Load it:                         docker exec labnet-fw nft -f /lab/nftables.conf
# Look at it:                      docker exec labnet-fw nft list ruleset

# Create the table if it is missing, then delete it, so loading this file always starts clean.
table inet labfw
delete table inet labfw

table inet labfw {
    chain input {
        type filter hook input priority 0; policy drop;

        # TODO(task 21): first, accept the replies to connections that are already allowed.

