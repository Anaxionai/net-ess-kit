! r1: office A's core router: staff, guest, r2 and edge-a.
! Done for you in the Guided starter: the interface addresses and the static route of task 7.
hostname r1
!
interface eth1
 description staff LAN, to pc1
 ip address 10.1.10.1/24
exit
!
interface eth2
 description guest LAN, to guest1
 ip address 10.1.20.1/24
exit
!
interface eth3
 description transit, to r2 eth3
 ip address 10.1.255.1/30
exit
!
interface eth4
 description transit, to edge-a eth1
 ip address 10.1.255.5/30
exit
!
! Task 7: the server LAN is behind r2.
ip route 10.1.30.0/24 10.1.255.2
!
! TODO(task 8): replace the static route with OSPF (router-id 1.1.1.1), with the host-facing interfaces passive.
!
