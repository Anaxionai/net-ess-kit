# Broken lab 5. The ticket is in README.md. Find the fault from the running lab.
# In the Containerlab terminal, from this folder:
#   containerlab deploy -t lab5.clab.yml --reconfigure
#   containerlab destroy -t lab5.clab.yml --cleanup
name: broken5

topology:
  kinds:
    frr:
      image: officelab-router
    linux:
      image: wbitt/network-multitool:extra
  nodes:
    r1:
      kind: frr
      daemons: [ospfd]
      startup-config: |
        hostname r1
        interface eth1
         ip address 10.10.1.1/24
         ip ospf passive
        exit
        interface eth2
         ip address 10.10.255.1/30
        exit
        router ospf
         ospf router-id 1.1.1.1
         network 10.10.1.0/24 area 0
         network 10.10.255.0/30 area 0
        exit
    r2:
      kind: frr
      daemons: [ospfd]
      startup-config: |
        hostname r2
        interface eth1
         ip address 10.10.2.1/24
         ip ospf passive
        exit
        interface eth2
         ip address 10.10.255.2/30
        exit
        router ospf
         ospf router-id 2.2.2.2
         network 10.10.2.0/24 area 0
         network 10.10.255.0/30 area 1
        exit
    pc1:
      kind: linux
      exec:
        - ip addr add 10.10.1.10/24 dev eth1
        - ip route replace default via 10.10.1.1
    srv1:
      kind: linux
      exec:
        - ip addr add 10.10.2.10/24 dev eth1
        - ip route replace default via 10.10.2.1

  links:
    - endpoints: ["pc1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth2"]
    - endpoints: ["r2:eth1", "srv1:eth1"]
