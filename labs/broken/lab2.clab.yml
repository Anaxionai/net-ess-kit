# Broken lab 2. The ticket is in README.md. Find the fault from the running lab.
# In the Containerlab terminal, from this folder:
#   containerlab deploy -t lab2.clab.yml --reconfigure
#   containerlab destroy -t lab2.clab.yml --cleanup
name: broken2

topology:
  kinds:
    frr:
      image: officelab-router
    linux:
      image: wbitt/network-multitool:extra
  nodes:
    r1:
      kind: frr
      daemons: [ospfd]
      startup-config: |
        hostname r1
        interface eth1
         ip address 10.7.1.1/24
        exit
        interface eth2
         ip address 10.7.2.1/24
        exit
      exec:
        - dnsmasq --interface=eth1 --bind-interfaces --no-resolv --no-hosts --domain=branch.internal --dhcp-range=10.7.1.100,10.7.1.199,1h --dhcp-option=option:router,10.7.1.1 --dhcp-option=option:dns-server,10.7.1.53 --host-record=srv1.branch.internal,10.7.2.10
    pc1:
      kind: linux
      exec:
        - ip route del default
        - umount /etc/resolv.conf
        - udhcpc -i eth1 -b
    srv1:
      kind: linux
      exec:
        - ip addr add 10.7.2.10/24 dev eth1
        - ip route replace default via 10.7.2.1

  links:
    - endpoints: ["pc1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "srv1:eth1"]
