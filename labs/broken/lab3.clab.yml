# Broken lab 3. The ticket is in README.md. Find the fault from the running lab.
# In the Containerlab terminal, from this folder:
#   containerlab deploy -t lab3.clab.yml --reconfigure
#   containerlab destroy -t lab3.clab.yml --cleanup
name: broken3

topology:
  kinds:
    frr:
      image: officelab-router
    linux:
      image: wbitt/network-multitool:extra
  nodes:
    r1:
      kind: frr
      daemons: [ospfd]
      startup-config: |
        hostname r1
        interface eth1
         ip address 10.8.1.1/24
        exit
        interface eth2
         ip address 10.8.2.1/24
        exit
    pc1:
      kind: linux
      exec:
        - ip addr add 10.8.1.10/24 dev eth1
        - ip route replace default via 10.8.1.1
    srv1:
      kind: linux
      exec:
        - ip addr add 10.8.2.10/16 dev eth1
        - ip route replace default via 10.8.2.1

  links:
    - endpoints: ["pc1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "srv1:eth1"]
