# Caddy's configuration for labnet-web, mounted at /etc/caddy/Caddyfile.
# (It is called caddy.conf in the repository so every tool can read it.)
:80 {
	# Requests for /api/... go to the api container, port 8000.
	reverse_proxy /api/* api:8000

	# Everything else is the page in web/site.
	root * /srv
	file_server
}
